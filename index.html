<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Cássia — OAB SP Santana de Parnaíba</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f5fa;color:#0d1526;font-size:14px}
header{background:#0f2d6b;color:#fff;padding:14px 18px}
header h1{margin:0;font-size:16px}
header p{margin:4px 0 0;font-size:12px;opacity:.8}
nav{background:#fff;border-bottom:1px solid #e1e6f0;display:flex;gap:4px;overflow-x:auto;padding:0 8px;position:sticky;top:0;z-index:5}
nav button{border:none;background:none;padding:12px 10px;font:600 13px system-ui,Arial;color:#7d879f;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:#1a56db;border-bottom-color:#1a56db}
main{padding:16px;max-width:1000px;margin:0 auto}
.aviso{background:#fff6df;color:#8a5a00;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.caso{background:#fff;border:1px solid #e1e6f0;border-radius:10px;padding:12px;margin-bottom:14px}
.caso h2{font-size:13px;margin:0 0 8px;color:#0f2d6b}
.caso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
label{display:block;font-size:12px;font-weight:700;color:#455069;margin-bottom:3px}
input,select,textarea{width:100%;border:1px solid #d6dce8;border-radius:7px;padding:7px 9px;font:13px system-ui,Arial;background:#fff}
textarea{min-height:60px;resize:vertical}
.card{background:#fff;border:1px solid #e1e6f0;border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:14px;color:#0f2d6b}
.card .pede{font-size:12px;background:#eaf1ff;color:#0f2d6b;padding:6px 8px;border-radius:6px;margin-bottom:8px}
.card pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 system-ui,Arial;color:#455069;margin:0 0 10px;background:#fafbfe;padding:10px;border-radius:7px;border:1px solid #eef1f7}
.falta{color:#8a5a00;background:#fff6df;font-size:12px;padding:5px 8px;border-radius:6px;margin-bottom:8px}
.btn{border:none;border-radius:7px;padding:8px 12px;font:700 12px system-ui,Arial;cursor:pointer;background:#1a56db;color:#fff;margin-right:6px}
.btn.sec{background:#eef1f7;color:#455069}
.btn.perigo{background:#fdecea;color:#b42318}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:#fff;border:1px solid #e1e6f0;border-radius:9px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.item.feito{opacity:.5}
.item.atras{border-left:4px solid #b42318}
.item.hoje{border-left:4px solid #e0a800}
.item .t{font-weight:700}
.item .m{font-size:12px;color:#7d879f;margin-top:2px}
.item .o{font-size:12.5px;color:#455069;margin-top:4px;white-space:pre-wrap}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:10px}
.sec-t{font-size:12px;font-weight:800;color:#7d879f;text-transform:uppercase;margin:16px 0 8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f2d6b;color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;display:none;z-index:9}
.vazio{color:#7d879f;padding:16px;text-align:center;background:#fff;border:1px dashed #d6dce8;border-radius:10px}
</style>
</head>
<body>

<header>
  <h1>Painel de Atendimento — Cássia</h1>
  <p>OAB SP · 247ª Subseção Santana de Parnaíba · Assistência Judiciária</p>
</header>

<nav id="nav">
  <button data-t="atend" class="on">Atendimento</button>
  <button data-t="advs">Advogados</button>
  <button data-t="cobr">Cobrança</button>
  <button data-t="forum">Fórum</button>
  <button data-t="agenda">Agenda</button>
</nav>

<main>
  <div class="aviso">Este painel é público, mas os dados ficam só neste navegador. Não coloque CPF nem número de processo na agenda.</div>

  <div class="caso" id="caso">
    <h2>Dados do caso (não são gravados)</h2>
    <div class="caso-grid">
      <div><label for="c-adv">Advogado(a)</label><input id="c-adv" oninput="renderTudo()"></div>
      <div><label for="c-oab">Nº OAB</label><input id="c-oab" oninput="renderTudo()" placeholder="123.456/SP"></div>
      <div><label for="c-ass">Assistido(a)</label><input id="c-ass" oninput="renderTudo()"></div>
      <div><label for="c-proc">Nº do processo</label><input id="c-proc" oninput="renderTudo()"></div>
      <div><label for="c-vara">Vara / comarca</label><input id="c-vara" oninput="renderTudo()"></div>
      <div><label for="c-tipo">Audiência ou prazo</label><select id="c-tipo" onchange="renderTudo()"><option value="">—</option><option>audiência</option><option>prazo processual</option></select></div>
      <div><label for="c-data">Data</label><input type="date" id="c-data" oninput="renderTudo()"></div>
      <div><label for="c-prazo">Prazo para resposta</label><input id="c-prazo" oninput="renderTudo()" placeholder="Ex.: 5 dias úteis"></div>
    </div>
    <button class="btn sec" onclick="limparCaso()">Novo caso</button>
  </div>

  <div id="conteudo"></div>

  <div id="agenda-area" style="display:none">
    <div class="sec-t">Nova demanda</div>
    <div class="row">
      <div><label for="a-data">Data</label><input type="date" id="a-data"></div>
      <div><label for="a-hora">Horário</label><input type="time" id="a-hora"></div>
      <div><label for="a-tipo">Tipo</label><select id="a-tipo"><option>Calendário da Subseção</option><option>Prazo</option><option>Audiência</option><option>Reunião</option><option>Outro</option></select></div>
    </div>
    <div style="margin-bottom:10px"><label for="a-titulo">Demanda</label><input id="a-titulo" placeholder="Ex.: Entregar relatório mensal"></div>
    <div style="margin-bottom:10px"><label for="a-obs">Observações (sem CPF nem processo)</label><textarea id="a-obs"></textarea></div>
    <button class="btn" onclick="addAgenda()">+ Adicionar</button>
    <div class="sec-t">Demandas</div>
    <div id="lista"></div>
    <div class="sec-t">Backup</div>
    <button class="btn sec" onclick="exportar()">💾 Baixar backup (.json)</button>
    <button class="btn sec" onclick="document.getElementById('imp').click()">📂 Importar backup</button>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importar(event)">
  </div>
</main>

<div id="toast"></div>

<script>
var MSGS_OK = true;
var DOCS = "— RG original e CPF\n— Comprovante de residência atualizado (água, luz, gás, telefone ou aluguel)\n— Comprovante de renda de todos os membros da família (3 últimos holerites, ou carteira de trabalho e extrato bancário dos últimos 3 meses, para quem não é registrado)\n— Comprovante de patrimônio, se houver\n— Em casos de alimentos: documento da criança e endereço da parte contrária\n— Em casos de divórcio: certidão de casamento atualizada";
var END_SANT = "Av. Tenente Marques, 5297 — Jardim do Luar (Fazendinha), Santana de Parnaíba/SP, dentro do Poupatempo";
var END_PIRA = "R. Bom Jesus, 106 — Centro, Pirapora do Bom Jesus/SP, CEP 06550-000";
var END_RECL = "Rua Alberto Frediani, 770 — Jardim Frediani, Santana de Parnaíba/SP — CEP 06502-155";
var ASS = "\n\nAtenciosamente,\nCássia\nAssistência Judiciária — OAB SP · Subseção Santana de Parnaíba\n(11) 4154-5191";
var FECHO = "\n\nFico à disposição.";

function v(id){ var e=document.getElementById(id); return e ? e.value.trim() : ''; }
function apres(){ var n=v('c-adv'); return "Olá, "+(n?"Dr(a). "+n:"Dr(a).")+", tudo bem? Aqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba."; }
function apresGeral(){ return "Olá, tudo bem? Aqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba."; }

var CASO = {
  ass: function(){ return v('c-ass') || '[assistido(a)]'; },
  proc: function(){ return v('c-proc') || '[nº do processo]'; },
  adv: function(){ return v('c-adv') || '[advogado(a)]'; },
  oab: function(){ return v('c-oab') || '[nº OAB]'; },
  vara: function(){ return v('c-vara') || '[vara/comarca]'; },
  tipo: function(){ return v('c-tipo') || '[audiência/prazo]'; },
  data: function(){ var d=v('c-data'); if(!d) return '[data]'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; },
  prazo: function(){ return v('c-prazo') || '[prazo]'; }
};

var TABS = {
  atend: [
    {t:'Boas-vindas', c:"Olá, tudo bem? Aqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nSeja bem-vindo(a). Como posso te ajudar hoje? Me conte sua necessidade e eu te oriento. Se o assunto for de outro setor, explico o caminho certo."+FECHO},
    {t:'Endereço e documentos — Santana de Parnaíba', pede:'Documentação completa e presença no atendimento', c:"Segue o endereço e a documentação para o atendimento.\n\nEndereço: "+END_SANT+"\nAtendimento: segunda a sexta-feira, das 9h às 12h. Distribuímos até 30 senhas por dia, no local, sem agendamento.\nTelefone: (11) 4154-5191\n\nDocumentos necessários:\n"+DOCS+"\n\nSem a documentação completa, o atendimento não é realizado."+FECHO},
    {t:'Endereço e documentos — Pirapora (CIC)', pede:'Documentação e presença na sexta-feira', c:"Em Pirapora do Bom Jesus, o atendimento é somente às sextas-feiras, das 9h às 12h, no CIC, com até 30 senhas por dia, distribuídas no local.\n\nEndereço: "+END_PIRA+"\n\nDocumentos necessários:\n"+DOCS+"\n\nNos demais dias da semana não há atendimento no local."+FECHO},
    {t:'Avaliação financeira vencida', pede:'Documentos atualizados e comparecimento presencial', c:"Verifiquei que a sua avaliação financeira está vencida. A validade é de 1 (um) ano, e a renovação é feita presencialmente.\n\nEndereço: "+END_SANT+"\nAtendimento: segunda a sexta-feira, das 9h às 12h (até 30 senhas por dia)\n\nDocumentos necessários:\n"+DOCS+"\n\nDepois da renovação, a indicação do advogado segue normalmente."+FECHO},
    {t:'Aguardando retorno', c:"Recebi o seu contato e estou verificando as informações. Assim que tiver o retorno, te aviso."+FECHO},
    {t:'Não recebemos áudio', c:"Por este canal não conseguimos ouvir mensagens de áudio. Pode enviar a sua dúvida por escrito, em texto, imagem ou documento, que eu te oriento."+FECHO},
    {t:'Pedir CPF para verificar a nomeação', pede:'CPF do assistido', c:apresGeral()+"\n\nPara verificar a nomeação do seu caso, preciso do seu CPF. Pode me enviar, por favor?"+FECHO},
    {t:'Nomeação recusada — nova triagem', pede:'Nova triagem presencial com documentos', c:apresGeral()+"\n\nVerifiquei que a nomeação do seu caso consta como recusada pelo advogado. Por isso, será necessária uma nova triagem presencial.\n\nEndereço: "+END_SANT+"\nAtendimento: segunda a sexta-feira, das 9h às 12h\n\nDocumentos necessários:\n"+DOCS+FECHO},
    {t:'Sem contato com o advogado — relato por escrito', pede:'Relato por escrito das tentativas de contato', c:apresGeral()+"\n\nVerifiquei que há nomeação válida no seu processo, e sinto muito pela dificuldade de contato. Para encaminhar o caso, preciso que me envie, por escrito, um relato com:\n— os meios que você usou para tentar contato;\n— as datas ou períodos das tentativas;\n— se houve alguma resposta, mesmo parcial;\n— se há audiência, prazo ou ato processual próximo."+FECHO},
    {t:'Reclamação presencial — orientação', pede:'Reclamação escrita, nº do processo, senha, RG e CPF', c:apresGeral()+"\n\nA reclamação contra advogado só pode ser feita presencialmente. Não aceitamos por WhatsApp, e-mail, áudio ou outro meio eletrônico.\n\nAo comparecer, leve:\n— reclamação escrita de próprio punho, descrevendo os fatos;\n— número do processo;\n— senha do processo (se não tiver, ela é gerada no atendimento presencial);\n— RG e CPF;\n— demais documentos do caso.\n\nAtendimento: segunda a sexta-feira, das 9h às 12h\nEndereço: "+END_RECL+"\nTelefone: (11) 4154-5191"+FECHO}
  ],
  advs: [
    {t:'Consulta de cadastro', pede:'Número da OAB', c:function(){return apres()+"\n\nPara consultar o seu cadastro, preciso do número da sua OAB. Pode me informar, por favor?"+FECHO;}},
    {t:'Andamento de inscrição', pede:'CPF e nome completo', c:function(){return apres()+"\n\nPara verificar o andamento do seu pedido de inscrição, preciso do seu CPF e do seu nome completo. Pode me enviar, por favor?"+FECHO;}},
    {t:'Inscrição na OAB SP — passo a passo', c:function(){return apres()+"\n\nSegue o passo a passo do pedido de inscrição:\n\n1. Acesse www2.oabsp.org.br e clique em \"Pedido de Inscrição Online\".\n2. Preencha a pré-inscrição com seus dados pessoais e do diploma.\n3. Gere e pague o boleto da taxa de inscrição.\n4. Agende o atendimento presencial em oabsp.org.br/servicos/agendamento-online.\n5. Compareça com os documentos originais e as cópias solicitados.\n6. Aguarde a análise e a aprovação pelo Conselho Seccional.\n\nA veracidade dos documentos é de responsabilidade do interessado."+FECHO;}},
    {t:'Certificado digital — orientação', c:function(){return apres()+"\n\nSegue a orientação sobre o certificado digital:\n\n1. Acesse oabsp.org.br e vá em Serviços → Certificado Digital.\n2. Escolha a certificadora parceira (Certdata ou Certisign).\n3. A compra e o agendamento da validação são feitos somente no site da certificadora escolhida.\n4. A validação pode ser presencial, por videoconferência ou online (esta última apenas para renovação de certificado ainda válido).\n\nA Subseção não realiza o agendamento de certificado digital."+FECHO;}},
    {t:'Retirada do token', pede:'Documento com foto e o número do pedido feito no site', c:function(){return apres()+"\n\nDepois da compra pelo site da certificadora, o token é retirado na Subseção, mediante identificação e o número do pedido.\n\nPara retirar, leve:\n— documento de identificação com foto;\n— o número do pedido gerado no site da certificadora."+FECHO;}},
    {t:'Dúvida sobre anuidade — um momento', c:function(){return apres()+"\n\nRecebi a sua dúvida sobre a anuidade. Um momento, por favor: vou verificar essa informação e retorno em seguida."+FECHO;}}
  ],
  cobr: [
    {t:'1ª cobrança — pedido de retorno', c:function(){return apres()+"\n\nInformo que o(a) assistido(a) "+CASO.ass()+", processo nº "+CASO.proc()+", relatou dificuldade para falar com o(a) senhor(a). Peço que entre em contato com ele(a) em breve."+FECHO+ASS;}},
    {t:'2ª cobrança — sem resposta', c:function(){return apres()+"\n\nJá entramos em contato solicitando retorno ao(à) assistido(a) "+CASO.ass()+", processo nº "+CASO.proc()+", e ainda não identificamos resposta. Reitero a solicitação e aguardo seu posicionamento com a maior brevidade possível."+FECHO+ASS;}},
    {t:'Urgente — audiência ou prazo próximo', c:function(){return apres()+"\n\nEntro em contato com caráter de urgência. O(a) assistido(a) "+CASO.ass()+", processo nº "+CASO.proc()+", tem "+CASO.tipo()+" marcado(a) para "+CASO.data()+" e ainda não conseguiu contato com o(a) senhor(a).\n\nPeço que retorne ao assistido com a máxima brevidade. Se houver algum impedimento, comunique-nos para que possamos ajudar."+ASS;}},
    {t:'Notificação formal — última etapa', c:function(){return apres()+"\n\nPor meio desta comunicação formal, informo a situação do(a) assistido(a) "+CASO.ass()+", processo nº "+CASO.proc()+". Conforme os registros desta Subseção, o(a) assistido(a) relatou ausência de contato ou retorno, apesar de tentativas por diferentes meios.\n\nSolicito que adote as providências necessárias e entre em contato com o(a) assistido(a) no prazo de "+CASO.prazo()+", sob pena de encaminhamento do caso às instâncias competentes da OAB SP.\n\nEste comunicado será registrado no histórico do caso."+ASS;}}
  ],
  forum: [
    {t:'Confirmação de nomeação ao juízo', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, informo que foi realizada a indicação de advogado(a) conveniado(a) para o processo nº "+CASO.proc()+", perante a "+CASO.vara()+".\n\nAdvogado(a): "+CASO.adv()+"\nInscrição OAB: "+CASO.oab()+"\nData da indicação: "+CASO.data()+"\n\nO ofício de indicação será encaminhado ao(à) advogado(a) pela Defensoria Pública, nos termos do Convênio DPESP/OAB-SP."+ASS;}},
    {t:'Curador especial — nomeação ativa', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, após consulta ao sistema DOL, verifiquei que, no processo nº "+CASO.proc()+", já consta advogado(a) nomeado(a) como curador(a) especial:\n\nAdvogado(a): "+CASO.adv()+"\nInscrição OAB: "+CASO.oab()+"\nData da indicação: "+CASO.data()+"\n\nO sistema não permite nova indicação enquanto a nomeação estiver ativa. Assim, o(a) advogado(a) acima atuará como curador(a) especial de todos os requeridos que necessitem de curador neste processo."+ASS;}},
    {t:'Curador especial — nomeação cancelada', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, informo que, no processo nº "+CASO.proc()+", a nomeação anterior de curador(a) especial foi cancelada e não há advogado(a) ativo(a) indicado(a).\n\nDiante disso, encaminhamos nova solicitação de indicação à Assessoria de Convênios da Defensoria Pública."+ASS;}},
    {t:'Solicitar dados para verificar curador', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, para verificar a existência de curador(a) especial já nomeado(a), solicito:\n\n— número completo do processo;\n— nome completo e dados da parte a ser assistida;\n— cópia do despacho ou decisão que determinou a nomeação.\n\nApós o recebimento, realizaremos a consulta e daremos retorno."+ASS;}},
    {t:'Dados para inventário ou alvará', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, para dar andamento à indicação no processo nº "+CASO.proc()+", nos casos de inventário ou alvará, precisamos de:\n\n— CPF do(a) falecido(a);\n— identificação completa dos herdeiros;\n— número completo do processo, comarca e vara.\n\nAssim que recebermos os dados, daremos seguimento ao encaminhamento."+ASS;}},
    {t:'Avaliação financeira vencida — intimação', c:function(){return "Prezada(o) Meritíssima(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atenção ao ofício recebido, informo que a avaliação financeira do(a) assistido(a) "+CASO.ass()+", referente ao processo nº "+CASO.proc()+", está vencida (validade de 1 ano), o que impede a indicação neste momento.\n\nSolicito que o(a) assistido(a) seja intimado(a) a comparecer presencialmente a:\n"+END_SANT+"\nHorário: segunda a sexta-feira, das 9h às 12h (até 30 senhas por dia, sem agendamento)\n\nDocumentos necessários:\n"+DOCS+"\n\nApós a renovação, a indicação será providenciada."+ASS;}},
    {t:'Envio de ofício de curador especial', c:function(){return "Prezada(o),\n\nAqui é a Cássia, da Assistência Judiciária da OAB SP, Subseção Santana de Parnaíba.\n\nEm atendimento à demanda de V. Sa., segue em anexo o Ofício de Indicação de Curador Especial referente ao processo nº "+CASO.proc()+", para as devidas providências."+ASS;}}
  ]
};

var ABA = 'atend';
var AG_KEY = 'cassia-agenda-simples';
var agenda = [];
try { agenda = JSON.parse(localStorage.getItem(AG_KEY) || '[]'); if(!Array.isArray(agenda)) agenda = []; } catch(e){ agenda = []; }

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(window._t); window._t=setTimeout(function(){t.style.display='none';},2200); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function copiarTexto(txt){
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){toast('Copiado!');}).catch(function(){fallbackCopy(txt);}); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copiado!'); }catch(e){ toast('Não foi possível copiar.'); }
  ta.remove();
}

function textoDe(m){ return typeof m.c==='function' ? m.c() : m.c; }

function renderTudo(){
  if(ABA==='agenda') return renderAgenda();
  var lista = TABS[ABA] || [];
  var html = '<div class="grid">';
  lista.forEach(function(m, i){
    var txt = textoDe(m);
    html += '<div class="card"><h3>'+esc(m.t)+'</h3>';
    if(m.pede) html += '<div class="pede">📌 Pedir: '+esc(m.pede)+'</div>';
    html += '<pre>'+esc(txt)+'</pre>';
    html += '<button class="btn" onclick="copiarMsg(\''+ABA+'\','+i+')">Copiar</button></div>';
  });
  html += '</div>';
  document.getElementById('conteudo').innerHTML = html;
  document.getElementById('caso').style.display = (ABA==='advs'||ABA==='cobr'||ABA==='forum') ? 'block' : 'none';
  document.getElementById('agenda-area').style.display = 'none';
}
function copiarMsg(aba, i){ copiarTexto(textoDe(TABS[aba][i])); }

function trocar(aba){
  ABA = aba;
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.t===aba); });
  if(aba==='agenda'){ renderAgenda(); }
  else renderTudo();
  window.scrollTo(0,0);
}

function salvar(){ try{ localStorage.setItem(AG_KEY, JSON.stringify(agenda)); }catch(e){} }

function addAgenda(){
  var d=document.getElementById('a-data').value, t=document.getElementById('a-titulo').value.trim();
  if(!d||!t){ toast('Preencha a data e a demanda.'); return; }
  agenda.push({id:Date.now(), data:d, hora:document.getElementById('a-hora').value, tipo:document.getElementById('a-tipo').value, titulo:t, obs:document.getElementById('a-obs').value.trim(), feito:false});
  salvar();
  document.getElementById('a-titulo').value=''; document.getElementById('a-obs').value='';
  renderAgenda(); toast('Adicionada.');
}
function alternar(id){ var it=agenda.find(function(x){return x.id===id;}); if(it){ it.feito=!it.feito; salvar(); renderAgenda(); } }
function remover(id){ if(!confirm('Remover esta demanda?')) return; agenda=agenda.filter(function(x){return x.id!==id;}); salvar(); renderAgenda(); }

function renderAgenda(){
  document.getElementById('conteudo').innerHTML = '';
  document.getElementById('caso').style.display = 'none';
  document.getElementById('agenda-area').style.display = 'block';
  var h = new Date(); var hoje = h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
  var ord = agenda.slice().sort(function(a,b){ return (a.data+a.hora).localeCompare(b.data+b.hora); });
  var html = '';
  if(!ord.length) html = '<div class="vazio">Nenhuma demanda anotada.</div>';
  ord.forEach(function(x){
    var p=x.data.split('-'), dataF=p[2]+'/'+p[1]+'/'+p[0];
    var cls = x.feito ? 'feito' : (x.data<hoje ? 'atras' : (x.data===hoje ? 'hoje' : ''));
    var rot = x.feito ? '' : (x.data<hoje ? ' · ATRASADA' : (x.data===hoje ? ' · HOJE' : ''));
    html += '<div class="item '+cls+'"><input type="checkbox" '+(x.feito?'checked':'')+' onchange="alternar('+x.id+')" style="width:auto;margin-top:4px">'
      + '<div style="flex:1"><div class="t">'+esc(x.titulo)+'</div><div class="m">'+dataF+(x.hora?' · '+esc(x.hora):'')+' · '+esc(x.tipo)+rot+'</div>'
      + (x.obs?'<div class="o">'+esc(x.obs)+'</div>':'')+'</div>'
      + '<button class="btn perigo" onclick="remover('+x.id+')">Remover</button></div>';
  });
  document.getElementById('lista').innerHTML = html;
}

function exportar(){
  var blob = new Blob([JSON.stringify({versao:1, agenda:agenda}, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'backup-agenda-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup gerado.');
}
function importar(ev){
  var f = ev.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.agenda)) throw new Error('formato');
      if(!confirm('Substituir a agenda atual pela do backup?')) return;
      agenda = d.agenda.filter(function(x){ return x && x.data && x.titulo; });
      salvar(); renderAgenda(); toast('Backup importado.');
    }catch(e){ toast('Arquivo inválido.'); }
    ev.target.value='';
  };
  r.readAsText(f);
}

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){ trocar(b.dataset.t); });
});
trocar('atend');
</script>
</body>
</html>
